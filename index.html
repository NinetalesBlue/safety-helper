  // ---------- 报告生成 (含保存与重新生成) ----------
  async function generateReport() {
    const type = document.getElementById('reportType').value;
    const monthVal = document.getElementById('reportMonth').value;
    if (!monthVal) return alert('请选择月份');
    const [year, month] = monthVal.split('-').map(Number);
    const periodLabel = type === 'monthly' ? `${year}年${month}月` : `${year}年第${Math.ceil(month/3)}季度`;

    const preview = document.getElementById('reportPreview');
    preview.style.display = 'block';
    preview.innerHTML = '<p>正在收集数据并生成AI分析…</p>';

    const { data: allRisks } = await supabaseClient.from('risks').select('*');
    if (!allRisks) { preview.innerHTML = '<p style="color:red;">数据加载失败</p>'; return; }

    const filtered = allRisks.filter(r => {
      const d = new Date(r.upload_time);
      if (type === 'monthly') return d.getFullYear() === year && (d.getMonth()+1) === month;
      else {
        const qStart = Math.floor((month-1)/3)*3 + 1;
        return d.getFullYear() === year && (d.getMonth()+1) >= qStart && (d.getMonth()+1) <= qStart+2;
      }
    });
    const confirmed = filtered.filter(r => r.status === 'confirmed' || r.status === 'fixed');
    const totalAnalysis = filtered.length;
    const totalConfirmedRisks = confirmed.reduce((acc, r) => acc + (r.confirmed_risks?.length || 0), 0);
    const typeCount = {};
    confirmed.forEach(r => {
      (r.confirmed_risks || []).forEach(idx => {
        const risk = r.ai_result?.risks?.[idx];
        if (risk) typeCount[risk.type] = (typeCount[risk.type]||0) + 1;
      });
    });
    const severityCount = {高:0, 中:0, 低:0};
    confirmed.forEach(r => {
      (r.confirmed_risks || []).forEach(idx => {
        const risk = r.ai_result?.risks?.[idx];
        if (risk) severityCount[risk.severity] = (severityCount[risk.severity]||0) + 1;
      });
    });
    const userStats = {};
    filtered.forEach(r => {
      if (!userStats[r.username]) userStats[r.username] = { analysis: 0, confirmed: 0 };
      userStats[r.username].analysis += 1;
      if (r.status === 'confirmed' || r.status === 'fixed') userStats[r.username].confirmed += (r.confirmed_risks?.length || 0);
    });

    // 上期对比
    let prevPeriodLabel = '', prevData = null;
    if (type === 'monthly') {
      const prevMonth = month === 1 ? 12 : month-1;
      const prevYear = month === 1 ? year-1 : year;
      prevData = allRisks.filter(r => {
        const d = new Date(r.upload_time);
        return d.getFullYear() === prevYear && (d.getMonth()+1) === prevMonth;
      });
      prevPeriodLabel = `${prevYear}年${prevMonth}月`;
    } else {
      const qStart = Math.floor((month-1)/3)*3 + 1;
      const prevQStart = qStart - 3;
      if (prevQStart >= 1) {
        prevData = allRisks.filter(r => {
          const d = new Date(r.upload_time);
          return d.getFullYear() === year && (d.getMonth()+1) >= prevQStart && (d.getMonth()+1) <= prevQStart+2;
        });
        prevPeriodLabel = `${year}年第${Math.ceil(prevQStart/3)}季度`;
      }
    }
    const prevConfirmed = prevData ? prevData.filter(r => r.status === 'confirmed' || r.status === 'fixed').reduce((acc, r) => acc + (r.confirmed_risks?.length || 0), 0) : 0;

    const statsForAI = {
      period: periodLabel,
      totalAnalysis,
      totalConfirmedRisks,
      typeDistribution: typeCount,
      severityDistribution: severityCount,
      users: userStats,
      previousPeriod: prevPeriodLabel,
      previousConfirmedRisks: prevConfirmed,
      change: prevConfirmed > 0 ? ((totalConfirmedRisks - prevConfirmed) / prevConfirmed * 100).toFixed(1) + '%' : '无历史数据'
    };

    let summary = '';
    try {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const token = session.access_token;
      const resp = await fetch(REPORT_FUNCTION, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ stats: statsForAI, period: periodLabel })
      });
      const result = await resp.json();
      if (result.success) summary = result.summary;
      else throw new Error(result.error);
    } catch (err) {
      summary = 'AI摘要生成失败，请检查报告函数配置。';
      console.error(err);
    }

    // 存储当前报告数据到变量，便于保存和重新生成
    window.currentReportData = { statsForAI, filtered, confirmed, summary, periodLabel, type };
    renderReportPreview();
  }

  function renderReportPreview() {

    preview.innerHTML = `

        <div class="stat-box"><div class="number">${statsForAI.totalConfirmedRisks}</div>确认隐患数</div>
      </div>
      <p>与${statsForAI.previousPeriod || '上一周期'}对比：隐患数量变化 ${statsForAI.change}</p>
      <div class="report-buttons">
        <button class="btn btn-success" id="exportExcelBtn">📥 导出 Excel</button>
        <button class="btn btn-outline" id="exportWordBtn">📄 导出 Word</button>
        <button class="btn btn-outline" id="saveReportBtn">💾 保存报告至云端</button>
        <button class="btn btn-sm" id="regenerateBtn">🔄 重新生成</button>
      </div>
    `;

    document.getElementById('exportExcelBtn').addEventListener('click', () => {

    });

      if (error) alert('保存失败：' + error.message);
      else alert('报告已保存至云端！');

    document.getElementById('regenerateBtn').addEventListener('click', () => {

    });
  }

  // 导出 Excel 和 Word 函数 (与之前相同)
  function exportReportExcel(stats, allRecords, confirmed, summary, period) {
    const wb = XLSX.utils.book_new();
    const overviewData = [['指标', '数值'], ['报告周期', period], ['总分析次数', stats.totalAnalysis], ['确认隐患总数', stats.totalConfirmedRisks], ['与上期对比变化', stats.change], ['AI摘要', summary]];
    const ws1 = XLSX.utils.aoa_to_sheet(overviewData);
    XLSX.utils.book_append_sheet(wb, ws1, '总览');
    const typeData = [['隐患类型', '数量'], ...Object.entries(stats.typeDistribution)];
    const ws2 = XLSX.utils.aoa_to_sheet(typeData);
    XLSX.utils.book_append_sheet(wb, ws2, '隐患类型');
    const sevData = [['风险等级', '数量'], ...Object.entries(stats.severityDistribution)];
    const ws3 = XLSX.utils.aoa_to_sheet(sevData);
    XLSX.utils.book_append_sheet(wb, ws3, '风险等级');
    const userData = [['用户', '分析次数', '确认隐患数'], ...Object.entries(stats.users).map(([u, d]) => [u, d.analysis, d.confirmed])];
    const ws4 = XLSX.utils.aoa_to_sheet(userData);
    XLSX.utils.book_append_sheet(wb, ws4, '人员上报');
    const detailData = [['记录ID', '用户', '上传时间', '状态', '隐患类型', '风险等级', '描述', '整改建议']];
    confirmed.forEach(r => {
      const risks = r.ai_result?.risks || [];
      risks.forEach(risk => detailData.push([r.id, r.username, new Date(r.upload_time).toLocaleString(), r.status, risk.type, risk.severity, risk.description, risk.suggestion]));
    });
    const ws5 = XLSX.utils.aoa_to_sheet(detailData);
    XLSX.utils.book_append_sheet(wb, ws5, '隐患明细');
    XLSX.writeFile(wb, `安全报告_${period}.xlsx`);
  }

  function exportReportWord(stats, summary, period, records) {
    const htmlContent = `
      <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word">
      <head><meta charset="utf-8"><title>安全报告</title></head>
      <body>
        <h1>${period} 管网安全报告</h1>
        <h2>AI 智能分析</h2>
        <p>${summary}</p>
        <h2>统计概览</h2>
        <p>总分析次数：${stats.totalAnalysis}，确认隐患：${stats.totalConfirmedRisks}，变化：${stats.change}</p>
        <h2>隐患类型分布</h2>
        <ul>${Object.entries(stats.typeDistribution).map(([k,v]) => `<li>${k}: ${v}次</li>`).join('')}</ul>
        <h2>风险等级分布</h2>
        <ul>${Object.entries(stats.severityDistribution).map(([k,v]) => `<li>${k}: ${v}次</li>`).join('')}</ul>
        <h2>人员上报情况</h2>
        <table border="1"><tr><th>用户</th><th>分析次数</th><th>确认隐患</th></tr>${Object.entries(stats.users).map(([u,d]) => `<tr><td>${u}</td><td>${d.analysis}</td><td>${d.confirmed}</td></tr>`).join('')}</table>
        <h2>详细隐患清单</h2>
        <table border="1"><tr><th>上传时间</th><th>用户</th><th>隐患类型</th><th>等级</th><th>描述</th><th>建议</th></tr>${records.filter(r => r.status==='confirmed'||r.status==='fixed').flatMap(r => (r.ai_result?.risks||[]).map(risk => `<tr><td>${new Date(r.upload_time).toLocaleString()}</td><td>${r.username}</td><td>${risk.type}</td><td>${risk.severity}</td><td>${risk.description}</td><td>${risk.suggestion}</td></tr>`)).join('')}</table>
      </body></html>
    `;
    const blob = new Blob(['\ufeff' + htmlContent], { type: 'application/msword' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `安全报告_${period}.doc`; a.click();
    URL.revokeObjectURL(url);
  }

  // 公用函数 (addLog, showUserData, exportDetailedCSV 等)
  async function addLog(action, detail) {
    await supabaseClient.from('logs').insert({
      user_id: currentUser.id,
      username: userProfile.username,
      action,
      detail,
      created_at: new Date().toISOString()
    });
  }

  function exportDetailedCSV(records) {
    if (!records || records.length === 0) return alert('无数据可导出');
    const headers = ['记录ID', '用户', '上传时间', '状态', '隐患类型', '风险等级', '隐患描述', '整改建议'];
    const rows = [];
    records.forEach(r => {
      const risks = r.ai_result?.risks || [];
      if (risks.length === 0) rows.push([r.id, r.username, new Date(r.upload_time).toLocaleString(), r.status, '', '', '', '']);
      else risks.forEach(risk => rows.push([r.id, r.username, new Date(r.upload_time).toLocaleString(), r.status, risk.type, risk.severity, risk.description, risk.suggestion]));
    });
    let csv = headers.join(',') + '\n';
    rows.forEach(row => csv += row.map(v => `"${v}"`).join(',') + '\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `safety_detail_${Date.now()}.csv`; a.click();
    URL.revokeObjectURL(url);
  }

  async function showUserData(uid) {
    const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', uid).single();
    const { data: risks } = await supabaseClient.from('risks').select('*').eq('user_id', uid).order('upload_time', { ascending: false });
    const detailDiv = document.getElementById('userDetail');
    let html = `<div class="card"><h4>📋 ${profile?.username} 的数据</h4>
      <p>累计分析：${risks?.length || 0} | 确认隐患：${risks?.reduce((acc, r) => acc + (r.confirmed_risks?.length||0), 0)}</p>
      <button class="btn btn-sm btn-danger" id="deleteUserDataBtn" data-uid="${uid}">删除所有数据</button>
      <button class="btn btn-sm btn-outline" id="exportUserCsvBtn" data-uid="${uid}" style="margin-left:8px;">📥 导出 CSV</button>
      <hr>`;
    risks?.forEach(r => html += renderRecordCard(r));
    html += '</div>';
    detailDiv.innerHTML = html;
    document.getElementById('deleteUserDataBtn').addEventListener('click', async () => {
      if (!confirm('确定删除？')) return;
      await supabaseClient.from('risks').delete().eq('user_id', uid);
      addLog('删除数据', `管理员删除用户 ${uid} 全部数据`);
      detailDiv.innerHTML = '<p>数据已删除</p>';
    });
    document.getElementById('exportUserCsvBtn').addEventListener('click', () => exportDetailedCSV(risks || []));
    attachRecordEvents();
  }

  // 请确保安全员相关函数（renderSafetyUI, renderSafetyPage, renderRecordCard, compressImage, attachRecordEvents）已完整保留
  init();
</script>
